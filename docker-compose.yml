services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketflow_dev_password}
      POSTGRES_DB: ${DB_NAME:-ticketflow}

    ports:
      - '${DB_PORT:-5432}:5432'
    
    #networks:
      #- app_network

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketflow-backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ticketflow}
      DB_USER: ${DB_USER:-ticketflow}
      DB_PASSWORD: ${DB_PASSWORD:-ticketflow_dev_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

    #networks:
      #- app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ticketflow-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-4200}:80"

    #networks:
      #- app_network


volumes:
  postgres_data:

