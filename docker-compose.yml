services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-ticketflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticketflow_dev_password}
      POSTGRES_DB: ${DB_NAME:-ticketflow}

    ports:
      - '${DB_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: