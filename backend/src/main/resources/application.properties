# ===============================
# Application
# ===============================
spring.application.name=ticketflow

# ===============================
# Server
# ===============================
server.port=${BACKEND_PORT:8080}

# ===============================
# PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketflow}
spring.datasource.username=${DB_USER:ticketflow}
spring.datasource.password=${DB_PASSWORD:ticketflow_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect