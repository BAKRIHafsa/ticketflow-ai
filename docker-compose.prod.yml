services:

  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${DOCKERHUB_USERNAME}/ticketflow-backend:${IMAGE_TAG}
    container_name: ticketflow-backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${DOCKERHUB_USERNAME}/ticketflow-frontend:${IMAGE_TAG}
    container_name: ticketflow-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-4200}:80"


volumes:
  postgres_data: